image:
  repository: pkmisma/sample-microservice-backend
  tag: <+pipeline.executionId>
  pullPolicy: IfNotPresent

# Default values - override per environment with envs/<env>.yaml
# The backend is only reachable inside the cluster; the frontend nginx proxies /api to it.
nameOverride: ""
# Stable service name so the frontend can reach it as http://cosmic-backend:<port>
fullnameOverride: cosmic-backend

# Target namespace (set per environment in envs/*.yaml)
namespace: cosmic-dev

env: dev
replicaCount: 1

service:
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
